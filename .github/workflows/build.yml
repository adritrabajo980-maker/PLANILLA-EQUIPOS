name: Compilar APK Flet

on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet y Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Instalar Java (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Compilar APK de Android
        run: |
          echo "y" | flet build apk --module-name PLA_SALIDA_DE_EQUIPOS

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/apk/app-release.apk
